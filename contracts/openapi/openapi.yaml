components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Сессия портала; изменяющие запросы — с заголовком `X-CSRF-Token`.
  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Курсор следующей страницы из `next_cursor`
      schema:
        type: string
        maxLength: 512
    Search:
      name: q
      in: query
      description: Поиск по названию, идентификаторам, адресу
      schema:
        type: string
        maxLength: 200
    Sort:
      name: sort
      in: query
      description: Поле сортировки; `-` — по убыванию
      schema:
        type: string
        pattern: ^-?[a-z_]{1,40}$
    From:
      name: from
      in: query
      description: Начало периода, UTC
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Конец периода (не включая), UTC
      schema:
        type: string
        format: date-time
    Bucket:
      name: bucket
      in: query
      description: Шаг агрегации
      schema:
        $ref: "#/components/schemas/Bucket"
    Format:
      name: format
      in: query
      required: true
      schema:
        enum:
          - csv
          - xlsx
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Токен из ответа входа; нет или не совпадает — 403
      schema:
        type: string
        minLength: 16
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Повтор запроса с тем же ключом возвращает уже созданную команду (7.2, Command)
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Внутренний идентификатор записи устройства (не Device ID IoT Hub)
      schema:
        $ref: "#/components/schemas/Id"
    CommandId:
      name: commandId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  responses:
    Unauthorized:
      description: Нет сессии или она истекла
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Роли это не разрешено (матрица 7.1) либо нет или неверен `X-CSRF-Token`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Нет такого объекта — или он другого арендатора, или, для End User, чужого клиента
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Конфликт с текущим состоянием (уникальность, статус, версия)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Ссылка или токен истекли либо уже использованы
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Locked:
      description: Вход временно заблокирован после неудачных попыток (7.4)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationError:
      description: Тело или параметры не прошли проверку
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    ConfirmationRequired:
      description: Нужно двойное подтверждение (V-108) — повторить с `confirm true`
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Превышен лимит запросов (7.4)
      headers:
        Retry-After:
          description: Через сколько секунд повторить
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: UTC
    ShortText:
      type: string
      minLength: 1
      maxLength: 200
    Bool:
      type: boolean
    Percent:
      type: number
      minimum: 0
      maximum: 100
    Days:
      type: integer
      minimum: 1
      maximum: 366
      default: 30
    Zoom:
      type: integer
      minimum: 0
      maximum: 22
    Bbox:
      type: string
      description: "Долгота и широта углов: `min_lng,min_lat,max_lng,max_lat`"
      pattern: ^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$
    Bucket:
      enum:
        - hour
        - day
        - week
        - month
        - quarter
    Resolution:
      enum:
        - raw
        - hour
        - day
      description: raw — кадры как есть (180 дней), hour/day — агрегаты (V-036)
    GroupBy:
      enum:
        - device
        - client
        - address
        - region
    TelemetryFields:
      type: string
      description: "Поля через запятую: t_hot, t_cold, water_total_l, filter_left_pct, rsrp"
      pattern: ^(t_hot|t_cold|water_total_l|filter_left_pct|rsrp)(,(t_hot|t_cold|water_total_l|filter_left_pct|rsrp))*$
    Language:
      enum:
        - lv
        - ru
        - en
        - et
        - lt
    PersonName:
      type: string
      minLength: 1
      maxLength: 120
    Email:
      type: string
      format: email
      maxLength: 254
    Password:
      type: string
      minLength: 12
      maxLength: 128
    Phone:
      type: string
      pattern: ^\+?[0-9 ()-]{5,32}$
    Problem:
      type: object
      description: RFC 9457
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required:
                  - path
                  - message
                properties:
                  path:
                    type: string
                    description: JSON Pointer поля
                  message:
                    type: string
    Page:
      type: object
      required:
        - items
        - next_cursor
      properties:
        next_cursor:
          type:
            - string
            - "null"
          description: null — страница последняя
    Confirm:
      type: object
      additionalProperties: false
      required:
        - confirm
      properties:
        confirm:
          const: true
          description: Двойное подтверждение (V-108)
    Switch:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
    SwitchConfirm:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        confirm:
          type: boolean
