# Источник — этот файл: правится руками, проверяется `npm test` (contracts/README.md).
openapi: 3.1.0
info:
  title: iCooler API
  version: 0.1.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  summary: REST API порталов оператора и End User, Stage 1
  description: |
    Каркас API по ТЗ Stage 1 (`doc/STAGE1_SPEC.md`): разделы 4.1–4.11, матрица прав 7.1, модель данных 7.2,
    команды 7.3, значения по умолчанию 7.4, портал End User 7.5.

    **Права.** У каждой операции `x-roles` — роли, которым она разрешена (матрица 7.1). Проверка на сервере
    для каждого запроса: роль не из списка — `403`; объект другого арендатора или, для End User, чужого
    клиента — `404` (существование не раскрывается). End User работает только с операциями `/eu/…`,
    остальные ему запрещены.

    **Сессия.** Порталы — cookie `session` (HttpOnly, Secure, SameSite=Strict); изменяющие запросы несут
    заголовок `X-CSRF-Token` из ответа входа. Срок — 12 ч у оператора, 30 дней у End User с «запомнить меня» (7.4).

    **Ошибки** — `application/problem+json` (RFC 9457). Лимиты запросов (7.4) — ответ `429` с `Retry-After`.

    **Команды устройству** создаются операциями действий (`/devices/{deviceId}/actions/…`), возвращают
    `202` и запись Command; итог — по `GET /commands/{commandId}` (статусы 7.3: pending → sent → ack →
    success / error / expired). Повтор с тем же `Idempotency-Key` возвращает ту же команду.

    **Двойное подтверждение** (V-108) — выключение нагрева, охлаждения, питания и сбросы: без `confirm: true`
    в теле — `428`.
servers:
  - url: /api/v1
tags:
  - name: auth
    description: Вход, сессии, приглашения (V-002)
  - name: profile
    description: Свой профиль (7.1)
  - name: tenants
    description: Арендаторы (SIG Administrator)
  - name: users
    description: Пользователи оператора (V-003)
  - name: end-users
    description: Учётные записи End User (7.5)
  - name: clients
    description: Клиенты, адреса, контакты (4.3)
  - name: devices
    description: Реестр и жизненный цикл (4.2)
  - name: telemetry
    description: Состояние, графики, события (4.5, 4.8)
  - name: commands
    description: Управление устройством (4.9, 7.3)
  - name: water
    description: Вода, фильтры, сбросы (4.6, 4.7, 7.2)
  - name: alerts
    description: Алерты и уведомления (4.10)
  - name: dashboard
    description: Дашборд, карта, отчёты (4.5, 4.3, 4.6)
  - name: esim
    description: eSIM — минимум Stage 1 (C-001, C-002, C-014, C-015)
  - name: admin
    description: Настройки, аудит, справочники (V-005, V-006, V-096)
  - name: enduser
    description: Портал End User — только свои кулеры (7.5)
security:
  - session: []
paths:
  /auth/login:
    post:
      tags:
        - auth
      operationId: login
      summary: Вход по e-mail и паролю (оба портала)
      description: 5 неудачных входов подряд на учётную запись — блокировка входа на 15 мин; лимит — 10 в минуту с IP (7.4).
      security: []
      x-roles:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Вход выполнен; cookie `session` установлена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "423":
          $ref: "#/components/responses/Locked"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      tags:
        - auth
      operationId: logout
      summary: Выход из текущей сессии
      x-roles:
        - any
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Сессия завершена
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout-all:
    post:
      tags:
        - auth
      operationId: logoutAll
      summary: Выход со всех устройств (V-002)
      x-roles:
        - any
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Все сессии пользователя завершены
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/forgot:
    post:
      tags:
        - auth
      operationId: forgotPassword
      summary: Письмо для восстановления пароля
      description: Ответ одинаковый, есть такой e-mail или нет. Лимит — 3 в час на e-mail и 20 в час с IP (7.4).
      security: []
      x-roles:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Если учётная запись есть — письмо отправлено
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/password/reset:
    post:
      tags:
        - auth
      operationId: resetPassword
      summary: Новый пароль по токену из письма
      security: []
      x-roles:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPassword"
      responses:
        "204":
          description: Пароль изменён, все сессии завершены
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/invitations/accept:
    post:
      tags:
        - auth
      operationId: acceptInvitation
      summary: Принять приглашение и задать пароль
      description: Ссылка приглашения действует 72 ч (7.5).
      security: []
      x-roles:
        - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenPassword"
      responses:
        "200":
          description: Учётная запись активна, вход выполнен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "410":
          $ref: "#/components/responses/Gone"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me:
    get:
      tags:
        - profile
      operationId: getProfile
      summary: Свой профиль
      x-roles:
        - any
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags:
        - profile
      operationId: updateProfile
      summary: Изменить имя и язык
      x-roles:
        - any
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Профиль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /me/password:
    put:
      tags:
        - profile
