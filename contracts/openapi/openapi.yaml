            - integer
            - "null"
          minimum: 1
          maximum: 60
          description: "Устройство offline: нет heartbeat N мин; по умолчанию 3"
        offline_alert_after_min:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1440
          description: Алерт «офлайн» (варианты 15, 30, 60, свой); по умолчанию 15
        hot_alert_below_set_c:
          type:
            - number
            - "null"
          minimum: 1
          maximum: 50
          description: "Горячая: алерт, если ниже уставки больше чем на N °C; по умолчанию 10"
        hot_alert_above_c:
          type:
            - number
            - "null"
          minimum: 90
          maximum: 110
          description: "Горячая: алерт выше N °C; по умолчанию 99"
        hot_alert_after_min:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 240
          description: "Горячая: дольше N мин при включённом нагреве; по умолчанию 10"
        cold_alert_above_set_c:
          type:
            - number
            - "null"
          minimum: 1
          maximum: 30
          description: "Холодная: алерт, если выше уставки больше чем на N °C; по умолчанию 5"
        cold_alert_below_c:
          type:
            - number
            - "null"
          minimum: -5
          maximum: 10
          description: "Холодная: алерт ниже N °C; по умолчанию 1"
        cold_alert_after_min:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 240
          description: "Холодная: дольше N мин при включённом охлаждении; по умолчанию 15"
        filter_warning_pct:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: "Фильтр: предупреждение при остатке ≤ N %; по умолчанию 20"
        filter_critical_pct:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 100
          description: "Фильтр: критично при остатке ≤ N % (или прошла дата замены); по умолчанию 5"
        upcoming_filters_days:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 366
          description: "Список ближайших замен: N дней (варианты 7, 30, 90, свой); по умолчанию 30"
        filter_forecast_window_days:
          type:
            - integer
            - "null"
          minimum: 7
          maximum: 365
          description: "Прогноз фильтра: средний суточный расход за N дней; по умолчанию 30"
    AuditEntry:
